site_name: Subnau — Base de connaissances
site_description: Base de connaissances cybersécurité de Mattéo Grech — writeups CTF et documentation de projets (IA, lab)
site_author: Subnau940
repo_name: Subnau940/CTF-Test-MkDocs
repo_url: https://github.com/Subnau940/CTF-Test-MkDocs
edit_uri: edit/main/docs/

theme:
  name: material
  language: fr
  custom_dir: overrides
  favicon: assets/favicon.svg
  icon:
    logo: fontawesome/solid/terminal
    repo: fontawesome/brands/github
    edit: material/source-pull
  palette:
    - scheme: slate
      primary: black
      accent: green
  font:
    text: JetBrains Mono
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/pdf-button.js
  - javascripts/contribute-target.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: fr
  - callouts

nav:
  - Accueil: index.md
  - CTF:
      - ctf/index.md
      - Cryptography:
          - ctf/cryptography/index.md
          - "13 (ROT13)": ctf/cryptography/rot13.md
          - "EVEN RSA CAN BE BROKEN": ctf/cryptography/even-rsa.md
          - Shared Secrets: ctf/cryptography/shared-secrets.md
          - Small Trouble (Boneh-Durfee): ctf/cryptography/small-trouble.md
          - StegoRSA: ctf/cryptography/stegorsa.md
          - "The Numbers (A1Z26)": ctf/cryptography/the-numbers-a1z26.md
          - Timestamped Secrets: ctf/cryptography/timestamped-secrets.md
          - hashcrack: ctf/cryptography/hashcrack.md
          - interencdec: ctf/cryptography/interencdec.md
      - Forensic:
          - ctf/forensic/index.md
          - Ph4nt0m 1ntrud3r (PCAP): ctf/forensic/ph4ntom-1ntrud3r.md
          - Riddle Registry (métadonnées PDF): ctf/forensic/riddle-registry.md
          - Timeline 0 (Timestomping): ctf/forensic/timeline-0.md
      - General skills:
          - ctf/general-skills/index.md
          - Absolute Nano: ctf/general-skills/absolute-nano.md
          - Failure Failure (HAProxy failover): ctf/general-skills/failure-failure.md
          - Sudo make me a sandwich: ctf/general-skills/sudo-sandwich.md
          - ping-cmd: ctf/general-skills/ping-cmd.md
      - Reverse Engineering:
          - ctf/reverse-engineering/index.md
          - Bypassme (LLDB + SUID): ctf/reverse-engineering/bypassme.md
          - Flag Hunters: ctf/reverse-engineering/flag-hunters.md
          - Transformation: ctf/reverse-engineering/transformation.md
          - VaultDoorTraining: ctf/reverse-engineering/vaultdoor-training.md
      - Web exploitation:
          - ctf/web-exploitation/index.md
          - "Crack the Gate 1 (backdoor header)": ctf/web-exploitation/crack-the-gate-1.md
          - Old Sessions (session hijacking): ctf/web-exploitation/old-sessions.md
          - "SQL / SQLiLite": ctf/web-exploitation/sqlilite.md
  - Projets:
      - projets/index.md
      - IA Heretic locale (pentest): projets/ia-heretic.md
  - Contribuer: contributing.md
