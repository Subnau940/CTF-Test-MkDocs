name: Build & deploy MkDocs site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (WeasyPrint, for PDF export)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 \
            libffi-dev libcairo2 shared-mime-info fonts-liberation

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build site (with PDF export)
        # Not --strict: mkdocs-with-pdf's on_post_build hook miscounts its
        # own internal link-resolution notices as build-breaking errors
        # whenever mkdocs's strict mode is active (observed: a single
        # expected/benign notice gets amplified into "131 errors" and the
        # plugin raises, killing the build). Nav/page structure is still
        # cross-checked manually before every push (see docs/contributing.md).
        run: mkdocs build
        env:
          ENABLE_PDF_EXPORT: "1"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
